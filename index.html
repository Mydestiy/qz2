  <style>
    :root {
      --bg-pastel: #FFF0F5;
      --bg-gradient: linear-gradient(135deg, #FFE4EC 0%, #FFF0F5 50%, #FDE2E4 100%);
      --pink-primary: #EC407A;
      --pink-dark: #AD1457;
      --pink-light: #FCE4EC;
      --pink-border: #F8BBD0;
      --card-bg: #FFFFFF;
      --text-main: #37474F;
      --text-muted: #78909C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Quicksand', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px 14px 60px;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
    }

    /* Header */
    .header-box {
      background: rgba(255, 255, 255, 0.92);
      border: 2.5px solid var(--pink-border);
      border-radius: 26px;
      padding: 20px 26px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(236, 64, 122, 0.1);
      margin-bottom: 20px;
    }

    .teacher-tag {
      display: inline-block;
      background: var(--pink-light);
      color: var(--pink-dark);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 5px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--pink-border);
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--pink-dark);
      margin-bottom: 6px;
    }

    .header-sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Controls: Search & Voice status */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.88);
      padding: 12px 18px;
      border-radius: 20px;
      border: 2px solid var(--pink-border);
    }

    .search-wrapper {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 999px;
      border: 2px solid var(--pink-border);
      font-size: 0.98rem;
      font-weight: 700;
      outline: none;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--pink-primary);
      box-shadow: 0 0 0 3px rgba(236, 64, 122, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }

    .voice-badge {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--pink-dark);
      background: var(--pink-light);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--pink-border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 24 Unit Tabs Grid */
    .tabs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid var(--pink-border);
      border-radius: 14px;
      padding: 9px 10px;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--pink-dark);
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      box-shadow: 0 3px 0 var(--pink-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn:hover {
      background: #FFF;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #EC407A, #D81B60);
      color: #FFFFFF;
      border-color: #AD1457;
      box-shadow: 0 4px 0 #880E4F;
    }

    /* Active Unit Content Box */
    .unit-banner {
      background: linear-gradient(135deg, #F48FB1, #EC407A);
      color: white;
      padding: 16px 24px;
      border-radius: 22px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(236, 64, 122, 0.25);
    }

    .unit-banner-title {
      font-size: 1.4rem;
      font-weight: 900;
    }

    .unit-count-pill {
      background: rgba(255, 255, 255, 0.25);
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
    }

    /* Vocabulary List Grid */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .vocab-card {
      background: var(--card-bg);
      border: 2px solid var(--pink-border);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 10px rgba(236, 64, 122, 0.05);
    }

    .vocab-card:hover {
      transform: translateY(-2px);
      border-color: #F48FB1;
      box-shadow: 0 6px 15px rgba(236, 64, 122, 0.12);
    }

    .vocab-info {
      flex: 1;
    }

    .vocab-word-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 3px;
    }

    .vocab-word {
      font-size: 1.08rem;
      font-weight: 900;
      color: #880E4F;
    }

    .vocab-pos {
      font-size: 0.76rem;
      font-weight: 800;
      color: #D81B60;
      background: #FCE4EC;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid #F8BBD0;
    }

    .vocab-meaning {
      font-size: 0.94rem;
      font-weight: 700;
      color: #455A64;
      line-height: 1.4;
    }

    .speak-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 14px;
      background: var(--pink-light);
      border: 2px solid var(--pink-border);
      color: var(--pink-dark);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 3px 0 var(--pink-border);
    }

    .speak-btn:hover {
      background: var(--pink-primary);
      color: white;
      border-color: var(--pink-dark);
      transform: scale(1.06);
    }

    .speak-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--pink-border);
    }

    .speak-btn.speaking {
      background: #00C9A7;
      color: white;
      border-color: #008770;
      animation: pulseSpeak 0.6s infinite alternate;
    }

    @keyframes pulseSpeak {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }
  </style>

    let currentUnit = 1;

    // Render 24 Tab Buttons
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      for (let i = 1; i <= 24; i++) {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${i === currentUnit ? 'active' : ''}`;
        btn.id = `tab-btn-${i}`;
        const shortName = rawUnitsData[i].title.split(': ')[1];
        btn.innerHTML = `Unit ${i}<br><span style="font-size:0.75rem; font-weight:700; opacity:0.9;">${shortName}</span>`;
        btn.onclick = () => switchUnit(i);
        container.appendChild(btn);
      }
    }

    // Switch Active Unit Tab
    function switchUnit(unitNum) {
      currentUnit = unitNum;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-btn-${unitNum}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('search-input').value = '';
      renderVocabList(rawUnitsData[unitNum].items);
    }

    // Render Vocabulary Cards for Selected Unit
    function renderVocabList(itemsArray) {
      const unitInfo = rawUnitsData[currentUnit];
      document.getElementById('current-unit-title').textContent = unitInfo.title;
      document.getElementById('current-unit-count').textContent = `${itemsArray.length} mục từ vựng`;

      const container = document.getElementById('vocab-container');
      container.innerHTML = '';

      itemsArray.forEach((rawStr, idx) => {
        const parts = rawStr.split('|');
        const word = parts[0] || '';
        const pos = parts[1] || '';
        const meaning = parts[2] || '';

        const card = document.createElement('div');
        card.className = 'vocab-card';

        // Clean text for speech synthesis (remove grammar notes like (v.), (n.), (adj.))
        const cleanSpeakText = word
          .replace(/\(v\.\)|\(n\.\)|\(adj\.\)/gi, '')
          .replace(/\((.*?)\)/g, '$1')
          .replace(/\//g, ' or ')
          .trim();

        card.innerHTML = `
          <div class="vocab-info">
            <div class="vocab-word-row">
              <span class="vocab-word">${word}</span>
              <span class="vocab-pos">${pos}</span>
            </div>
            <div class="vocab-meaning">${meaning}</div>
          </div>
          <button type="button" class="speak-btn" id="speak-btn-${idx}" title="Nghe phát âm chuẩn Anh-Anh (en-GB)" onclick="speakBritish('${cleanSpeakText.replace(/'/g, "\\'")}', 'speak-btn-${idx}')">
            🔊
          </button>
        `;
        container.appendChild(card);
      });
    }

    // Search Filter within Current Unit
    function filterVocab() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const allItems = rawUnitsData[currentUnit].items;
      if (!q) {
        renderVocabList(allItems);
        return;
      }
      const filtered = allItems.filter(item => item.toLowerCase().includes(q));
      renderVocabList(filtered);
    }

    // Web Speech API - Standard British English (en-GB) Pronunciation
    let voicesList = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        voicesList = window.speechSynthesis.getVoices();
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakBritish(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert("Trình duyệt của bạn không hỗ trợ phát âm tự động.");
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      utterance.rate = 0.92;

      // Prioritize authentic British English voices (Google UK English, Microsoft Libby/Sonia/Ryan, Apple Daniel)
      if (voicesList.length === 0) voicesList = window.speechSynthesis.getVoices();
      const gbVoice = voicesList.find(v => v.lang === 'en-GB' && (v.name.includes('UK') || v.name.includes('British') || v.name.includes('Daniel') || v.name.includes('Libby') || v.name.includes('Sonia')))
                   || voicesList.find(v => v.lang === 'en-GB' || v.lang === 'en_GB')
                   || voicesList.find(v => v.lang.startsWith('en'));

      if (gbVoice) {
        utterance.voice = gbVoice;
      }

      const btn = document.getElementById(btnId);
      if (btn) btn.classList.add('speaking');

      utterance.onend = () => {
        if (btn) btn.classList.remove('speaking');
      };
      utterance.onerror = () => {
        if (btn) btn.classList.remove('speaking');
      };

      window.speechSynthesis.speak(utterance);
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      switchUnit(1);
    });
  </script>
